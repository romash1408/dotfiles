[packages]
# CLI tools installed everywhere (brew formulae).
# NO tmux here: on Linux it must be the system one (apt). A newer brew tmux
# client can't attach to an older system tmux server (claude-remote on p8p
# runs /usr/bin/tmux): "open terminal failed: not a terminal". Verified: brew
# 3.7b client + brew server works, brew client + system 3.5a server fails.
brews = [
  "git", "curl", "wget", "vim", "htop", "jq",
  "tree", "ncdu", "ripgrep", "fzf",
  "mc", "kubectl", "helm",
  # herdr: терминальный мультиплексор для агентов. Клиент нужен всюду,
  # сервер как systemd-юнит — только при herdrServer (см. .chezmoiignore).
  "herdr",
]

[packages.darwin]
# macOS-only brew formulae (no system tmux there to conflict with)
brews = ["tmux"]
# macOS GUI apps (brew casks)
casks = []

[packages.linux]
# System (apt) packages for Linux: client/server tools that must match the
# system-side daemon (tmux: claude-remote's server runs /usr/bin/tmux), plus
# things brew doesn't ship on Linux (net-tools).
# The "already installed" check is `command -v <binary>`. When the package name
# differs from the binary, write "package:binary" — net-tools gives ifconfig,
# netstat and route.
apt = ["tmux", "net-tools:ifconfig"]
# Linux GUI apps (flatpak from flathub, "org.app.Id"), only when hasGUI
flatpaks = []

[packages.android]
# Termux (chezmoi from `pkg` is built with GOOS=android, so .chezmoi.os is
# "android", not "linux"). No Homebrew there, everything comes from pkg.
# Mirror of packages.brews under Termux package names, minus what pkg doesn't
# ship (herdr), plus tmux/net-tools that come from apt on regular Linux.
# Plain package names: the install script checks `dpkg -s`, not binaries.
pkg = [
  "git", "curl", "wget", "vim", "htop", "jq",
  "tree", "ncdu", "ripgrep", "fzf",
  "mc", "kubectl", "helm",
  "tmux", "net-tools", "openssh", "zsh",
]
